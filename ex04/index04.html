<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ex04 - The Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <h1>CSS Box Model Behavior</h1>
        
        <div class="models-container">
            <div class="box standard-model">
                <h3>Content-Box Model</h3>
                <p>Width: 200px<br>Padding & Border added outside</p>
            </div>

            <div class="box alternative-model">
                <h3>Border-Box Model</h3>
                <p>Width: 200px<br>Padding & Border absorbed inside</p>
            </div>
        </div>
    </div>

</body>
</html>
