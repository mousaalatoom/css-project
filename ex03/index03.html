<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Ex03 - Colors and Transparency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="palette-container">
        <h1>Spectrum & Color Models</h1>
        <div class="swatches-wrapper">
            <div class="color-box name-box">Named Color</div>
            <div class="color-box hex-box">HEX Code</div>
            <div class="color-box rgb-box">RGB Format</div>
            <div class="color-box rgba-box">RGBA Transparent</div>
        </div>
    </section>

    <section class="comparison-section">
        <h2>Opacity vs RGBA Demonstration</h2>
        <div class="diff-wrapper">
            <div class="test-card opacity-card">
                <p>Using Opacity 0.5<br>(Fades Box and Text Together)</p>
            </div>
            <div class="test-card rgba-card">
                <p>Using RGBA Background<br>(Text Stays Solid)</p>
            </div>
        </div>
    </section>

</body>
</html>
